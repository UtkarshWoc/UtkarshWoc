name: Ping Render Apps

# Run periodically
on:
  schedule:
    # Every 10 minutes (change to '*/5 * * * *' if you want every 5 minutes)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render apps
        run: |
          URLS=(
            "https://studytantra-mern-1.onrender.com"
            # Add more Render URLs below as needed:
            # "https://another-project.onrender.com"
          )

          for url in "${URLS[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$url")
            echo "Pinged $url with status: $STATUS"
          done